<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>돌아봄 | 계획과 실행 기록</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="돌아봄 홈"><span class="brand-mark">ㄷ</span><span>돌아봄</span></a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a href="#home" data-nav="home">대시보드</a>
      <a href="#plans" data-nav="plans">계획과 할 일</a>
      <a href="#review" data-nav="review">돌아보기</a>
    </nav>
    <button class="button button-outline button-small" id="exportButton" type="button">내 자료 내보내기</button>
  </header>

  <main class="shell">
    <div class="privacy-notice" role="note">
      <span class="notice-icon" aria-hidden="true">!</span>
      <p><strong>공개 링크 안내</strong> 지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요.</p>
      <button class="notice-close" id="dismissNotice" type="button" aria-label="안내 접기">×</button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <section id="view" aria-live="polite"></section>
  </main>

  <dialog id="modal" class="modal">
    <div class="modal-frame">
      <button class="modal-x" type="button" data-action="close-modal" aria-label="닫기">×</button>
      <div id="modalContent"></div>
    </div>
  </dialog>

  <footer class="footer"><span>돌아봄</span><span>계획에서 배움을 찾아 다음 계획으로</span></footer>
</body>
</html>
